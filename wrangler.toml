name = "second-brain-bot"
main = "src/entry.py"
compatibility_flags = ["python_workers"]
compatibility_date = "2026-10-21"

# Workers AI (Llama for answers/summaries, bge for embeddings, Whisper for voice).
[ai]
binding = "AI"

# 1. npx wrangler d1 create second-brain-db
# 2. paste the printed database_id below
# 3. npx wrangler d1 execute second-brain-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "second-brain-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# npx wrangler vectorize create second-brain-chunks --dimensions=768 --metric=cosine
# (768 dims matches @cf/baai/bge-base-en-v1.5 below)
[[vectorize]]
binding = "VECTORIZE"
index_name = "second-brain-chunks"

[vars]
LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
WHISPER_MODEL = "@cf/openai/whisper"
# Comma-separated Telegram chat ids that may use the bot (recommended!).
# Find yours by messaging @userinfobot. Empty = anyone who finds the bot.
ALLOWED_CHAT_IDS = ""

# Secrets (never in git):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN       (from @BotFather)
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET  (any long random string)
